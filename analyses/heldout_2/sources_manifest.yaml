  license: CC-BY-4.0
  include_globs: ['**/Data/responses.csv', '**/Data/blocks_count.csv']
  table_options:
    '**/Data/responses.csv':
      wide_to_long:
        id: ['Participant number:']
        level: block
        levels: [1, 2, 3, 4, 5, 6]
        columns:
          condition: ['Which condition was played? (filled in by experimenter)', 'Which condition was played? (filled in by experimenter).1', 'Which condition was played? (filled in by experimenter).2',
            'Which condition was played? (filled in by experimenter).3', 'Which condition was played? (filled in by experimenter).4', 'Which condition was played? (filled in by experimenter).5']
          umux1: ['UMUX questionnaire [The system''s capabilities meet my requirements]', 'UMUX questionnaire [The system''s capabilities meet my requirements].1', 'UMUX questionnaire [The system''s capabilities
              meet my requirements].2', 'UMUX questionnaire [The system''s capabilities meet my requirements].3', 'UMUX questionnaire [The system''s capabilities meet my requirements].4', 'UMUX questionnaire
              [The system''s capabilities meet my requirements].5']
          umux2: ['UMUX questionnaire [Using this system is a frustrating experience]', 'UMUX questionnaire [Using this system is a frustrating experience].1', 'UMUX questionnaire [Using this system is
