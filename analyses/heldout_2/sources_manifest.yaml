              is easy to use].3', 'UMUX questionnaire [The system is easy to use].4', 'UMUX questionnaire [The system is easy to use].5']
          umux4: ['UMUX questionnaire [I have to spend too much time correcting things with this system]', 'UMUX questionnaire [I have to spend too much time correcting things with this system].1', 'UMUX
