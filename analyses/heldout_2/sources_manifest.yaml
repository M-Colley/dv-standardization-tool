# Batch manifest of the second held-out test (docs/preregistration_heldout_relations_2.md).
# Files: analyses/heldout_2/sources.yaml, downloaded and verified with
#   python -m opendv.analysis.confirmatory fetch --sources analyses/heldout_2/sources.yaml --data-dir data/raw/heldout_2
# Mappings: analyses/heldout_2/mappings/ (frozen with this file). Study designs: schemas/study_designs.yaml.
#
# Dropped under the pre-registered exclusion rules:
#   eeg_sonification_2025: cannot be downloaded (Dryad answers HTTP 401 for every file)
#   immersive_analytics_scale_2026: no participant-level data: the table has no participant identifier, so no row can be attributed to a participant
#   cyclist_overtaking_2025: fewer than two schema DVs in the downloaded files: the end-of-study perceived-safety and stress items are not in appen.csv (they are in the unpinned 137 MB heroku.json); the simulator questionnaire adds only an acceptance item
#   ceap_360vr_2021: the NASA-TLX is stored as seven numbers per block whose items are undocumented (README, dataset description), so no subscale can be labelled; SSQ, IPQ and SAM are space-separated strings inside nested JSON, which would need a new reader for DVs that bear on no target
#   child_pedestrian_vr_2025: the questionnaire items T2-T13 are undocumented, so perceived safety cannot be identified; the motion-capture rows carry participant and trial in one code, which would need a new reader for DVs that bear on no target
#   audiobook_driving_2024: the lane-keeping and distance measures are pivot-table blocks side by side, each with its own participant column; the only plain table (hazard reaction times) holds one DV; reading the blocks would need a new reader for DVs that bear on no target
sources:
- source_id: ar_telepresence_arm_2023
