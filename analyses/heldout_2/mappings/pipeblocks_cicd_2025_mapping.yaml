# Second held-out test mapping for pipeblocks_cicd_2025 (docs/preregistration_heldout_relations_2.md).
# Paper: the study is reported in the VL/HCC 2025 full paper "A Block-Based Language for CI/CD
#   Authoring" (da Giao, Pereira, Cunha), which cites this deposit; the deposit's linked DOI
#   10.1109/VL-HCC65237.2025.00025 is the companion tool demo.
# Data: Zenodo 10.5281/zenodo.15434390, CC-BY-4.0; reproducibility.zip.
# Files (Google Forms exports, one row per participant x tool; 10 MSc students used both tools):
#   - NASA TLX.csv: six subscales on 0-20 ("0 (Low) - 20 (High)") and the 15 pairwise comparisons.
#     Performance asks "How successful were you ...?" with 0 = low, 20 = high, so high is good; it is
#     reversed to the schema's direction (high = failure).
#   - sus.csv: the ten SUS items (1-5, standard order and wording) of a Forms quiz, whose [Score] and
#     [Feedback] columns are empty quiz artefacts.
# The study number is the participant id in both files.

Timestamp: meta_timestamp
? 'Study number

  (You study number)'
: meta_participant_id
Tool: meta_condition_tool
? 'Mental Demand

  How much mental and perceptual activity was required (e.g., thinking, deciding, calculating, remembering, looking, searching, etc.)? Was the task easy or demanding, simple or complex?

  Scale: 0 (Low) – 20 (High).'
: mental_demand
? "Physical Demand \nHow much physical activity was required (e.g., pushing, pulling, turning, controlling, activating, etc.)? Was the task easy or demanding, slow or brisk, slack or strenuous?\nScale: 0 (Low) – 20 (High)."
: physical_demand
? "Temporal Demand \nHow much time pressure did you feel due to the pace of the task? Was the pace slow and leisurely or rapid and frantic?\nScale: 0 (Low) – 20 (High)."
: temporal_demand
? 'Performance

  How successful were you in accomplishing the task’s goals? How satisfied were you with your performance?


  Scale: 0 (Low) – 20 (High).'
: performance
? "Effort \nHow hard did you have to work (mentally and physically) to achieve your performance level?\n\nScale: 0 (Low) – 20 (High)."
: effort
? 'Frustration

  How insecure, irritated, or stressed did you feel during the task?


  Scale: 0 (Low) – 20 (High).'
: frustration
? 'Effort vs. Performance

  Effort: "How hard did you have to work (mentally and physically)?"

  Performance: "How successful were you in accomplishing the task’s goals?"'
: meta_tlx_pairwise_effort_vs_performance
