Total score: meta_form_total_score

# Left unlabelled: the [Score] and [Feedback] quiz columns of sus.csv.

reverse_items:
- columns:
  - 'Performance

    How successful were you in accomplishing the task’s goals? How satisfied were you with your performance?


    Scale: 0 (Low) – 20 (High).'
  scale_range:
  - 0
  - 20
  reason: TLX performance asked as success, 0 low - 20 high; the schema's performance is high = failure

exclude_rows:
  - column: "Study number\n(You study number)"
    values: [6]
    reason: participant 6 is excluded from the analyses in the paper (VL/HCC 2025 full paper)
