  use_llm_deduction: true
- study_set: development
  source_id: fact_av
  source_type: github_repo
  location: https://github.com/M-Colley/FACT-AV
  ref: main
  include_globs:
  - data/all_combined_prepared.xlsx
  mapping_path: schemas/fact_av_mapping.yaml
  override_standard_aliases: true
  llm_context: 'FACT-AV study on trust and acceptance factors for automated vehicles. understanding_rating is the sART Understanding
    subscale (0–20), NOT an eHMI comprehension item — it is mapped to sart_understanding.

    '
  use_llm_deduction: true
- study_set: development
  source_id: running_into_traffic_chi26
  source_type: web_dataset
  location: https://zenodo.org/records/18344381/files/RunIntoTraffic.zip?download=1
  publication_doi: 10.1145/3772318.3790401
  include_globs:
  - '**/*.csv'
  exclude_globs:
  - '**/running_ranking.csv'
  extract_archives: true
  archive_max_depth: 2
  mapping_path: schemas/running_into_traffic_mapping.yaml
  llm_context: 'Al-Taie et al. (CHI 2026) "Running into Traffic." Per-trial questionnaire data for runner–AV interaction with
    eHMIs. Columns prefixed tlx.* are NASA-TLX subscales (mental/physical/rush=temporal/success=performance/ effort/stress=frustration).
    safety, trust, risk are the corresponding perception ratings. ueq.p.* and ueq.h.* are UEQ-Short pragmatic and hedonic
    items respectively. running_ranking.csv encodes per-condition rankings (Overall/Walking/Running × eHMI condition) which
    are not direct DV scores and intentionally remain unmapped.

    '
  use_llm_deduction: true
- study_set: development
  source_id: psych_conflict_handling
  source_type: github_repo
  location: https://github.com/as116/psychological-conflict-handling-strategies
  ref: main
  publication_doi: 10.1145/3678511
  include_globs:
  - '**/*.csv'
  - '**/*.xlsx'
  - '**/*.xls'
  mapping_path: schemas/psych_conflict_handling_mapping.yaml
  llm_context: 'Stampf, Colley et al. (IMWUT 2024) "Examining Psychological Conflict-Handling Strategies for Highly Automated
    Vehicles." VR driving-simulator study, 36 participants x 12 persuasion conditions. StudyResults.xlsx sheet "Blatt 1":
    C1-C5 = perceived user-vehicle conflict items (5-point), ST1-ST6 = STS-AD situational-trust items (7-point; items 2/4/5
    reverse-scored), A1-A2 = task-feasibility items, A3 = perceived vehicle influence on the user''s decision, A4 = acceptance.
    Cells hold textual Likert labels (English for C*/ST*, German for A*), so the explicit mapping is authoritative; the LLM
    fallback is unlikely to improve on it.

    '
  use_llm_deduction: true
- study_set: development
  source_id: scrolling_in_the_deep_chi25
  source_type: github_repo
  location: https://github.com/luca-maxim/scrollingInTheDeep
  ref: main
  publication_doi: 10.1145/3706598.3713187
  include_globs:
  - '**/*.csv'
  mapping_path: schemas/scrolling_in_the_deep_mapping.yaml
  llm_context: 'Meinhardt, Colley et al. (CHI ''25) "Scrolling in the Deep." In-situ study of digital-wellbeing intervention
    effectiveness during infinite scrolling. The only study data is data_scrolling_in_the_deep.csv (the rest of the repo is
    the Android app). DVs: Valence (SAM, 1-5), Reactance (psychological reactance, 1-5), Sleepiness (KSS, 1-9), Responsiveness
    (latency to the intervention, seconds). App_Name, At_Home, Current_Activity, Multitasking, Social_Situation are contextual
    IVs and Age/Gender are demographics — all locked as meta_* in the mapping.

    '
  use_llm_deduction: true
