  mapping_path: schemas/ehmi_for_all_chi26_mapping.yaml
  include_globs:
  - '**/*.csv'
  - '**/*.xlsx'
  - '**/*.xls'
  exclude_globs:
  - '**/plots/**'
  llm_context: 'eHMI effects on pedestrians, drivers, cyclists in VR (CHI 2026). DVs: TLX1, SUS, AOA Usefulness/Satisfying,
