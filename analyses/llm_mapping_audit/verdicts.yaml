# Verdicts on the LLM-mapped columns the all-mappings analysis pooled
# (inventory.csv, batch run lock39 of 2026-11-14). Written on 2026-11-15 from each
# study's codebook, paper, README or analysis script, before any mapping was changed.
#
# One entry is one decision. `columns` lists raw column names; `pattern` is a regular
# expression the whole raw column name must match. An entry covers every file the column
# occurs in (e.g. 37 per-participant questionnaire files) and every standardized column
# made from it (including a batch composite of LLM-mapped items). `llm_dv`, when given,
# restricts the entry to columns the LLM mapped to that DV.
#
# verdict:
#   correct    the LLM's DV is right
#   wrong_dv   the column measures another schema DV (target)
#   not_a_dv   no schema DV fits
#   unclear    the documentation does not settle it (missing says what is missing);
#              llm_dv_ruled_out: true when it does rule out the LLM's DV
# target: the right schema DV (wrong_dv), or the LLM's DV (correct).
# evidence: document and section.
#
# Documents named "(cache)" are files of the study's repository in the batch's download
# cache (data/processed/cache/<source>_<hash>/); "(raw)" ones are under
# data/raw/development/<source>/. "mapping header" is the curated mapping file's header
# in schemas/, which cites the codebook it was written from.

# --- 3d_display_comp_vehicle -------------------------------------------------------------
- study: 3d_display_comp_vehicle
  columns: [SART1, SART2, SART3]
  verdict: wrong_dv
  target: sart_demand
  evidence: >-
    3d-comp-vehicle.R (cache) l.53-58: Demand = SART1 + SART2 + SART3, Supply = SART4..7,
    Understanding = SART8..10, SA = Understanding - (Demand - Supply). A single item is not
    the SART total (U - (D - S)); averaging all ten items mixes the demand items, which
    enter the total negatively, with the others.
- study: 3d_display_comp_vehicle
  columns: [SART4, SART5, SART6, SART7]
  verdict: wrong_dv
  target: sart_supply
  evidence: 3d-comp-vehicle.R (cache) l.55, Supply = SART4 + SART5 + SART6 + SART7.
- study: 3d_display_comp_vehicle
  columns: [SART8, SART9, SART10]
  verdict: wrong_dv
  target: sart_understanding
  evidence: 3d-comp-vehicle.R (cache) l.56, Understanding = SART8 + SART9 + SART10.
- study: 3d_display_comp_vehicle
  columns: [TiA_Trust1, TiA_Trust2]
  verdict: correct
  target: tia_trust_in_automation
  evidence: >-
    3d-comp-vehicle.R (cache) l.61: overallTiATrust = mean(TiA_Trust1, TiA_Trust2), the
    trust subscale of Koerber's TiA (items 9 and 14), as in the same lab's
    bvi_auditory_hav_autoui26 (mapping header, notes).
- study: 3d_display_comp_vehicle
  columns: [TiA_U1, TiA_U2, TiA_U3, TiA_U4]
  verdict: wrong_dv
  target: tia_understanding_predictability
  evidence: >-
    3d-comp-vehicle.R (cache) l.63-67: TiA_U2 and TiA_U4 reversed (6 - x),
    overallTiAUnderstanding = mean of TiA_U1..4, plotted as "Understanding": the
    understanding/predictability subscale of Koerber's TiA (items 2, 7, 11, 16; 7 and 16
    reverse-keyed), not its trust subscale. The data agree: U2 and U4 correlate negatively
    with U1, U3 and the trust items.
- study: 3d_display_comp_vehicle
  columns: [perceivedSafety1, perceivedSafety3, perceivedSafety4]
  verdict: correct
  target: perceived_safety
  evidence: >-
    3d-comp-vehicle.R (cache) l.70: ps_score = mean of perceivedSafety1..4, -3..+3, the
    Faas et al. (2020) perceived-safety items the lab uses (bvi_auditory_hav_autoui26
    mapping header).
- study: 3d_display_comp_vehicle
  columns: [perceive_distances_better, perceive_surroundings_better]
  verdict: not_a_dv
  evidence: >-
    3d-comp-vehicle.R (cache) l.77 and l.181-192: separate 1-7 items on how well the display
    let participants perceive distances and the surroundings, analysed one by one; not a
    perceived-safety item (the scale is perceivedSafety1-4, -3..+3).
- study: 3d_display_comp_vehicle
  columns: [predict_paths]
  verdict: not_a_dv
  evidence: >-
    3d-comp-vehicle.R (cache) l.163-165: single 1-7 item "Predict Vehicle Path", analysed on
    its own; not an item of Koerber's TiA understanding/predictability subscale (TiA_U1-4,
    1-5).
- study: 3d_display_comp_vehicle
  columns: [unsafeJudgement]
  verdict: wrong_dv
  target: sts_ad_item_05
  evidence: >-
    Colley et al. MUM '23 (DOI 10.1145/3626705.3627786; full text at uni-ulm.de/.../MUM_2023_3D_Display_final_compressed.pdf), sec. 3.3 Measurements: the Judgement subscale of the Situational Trust Scale for Automated Driving,
    "The automated vehicle made an unsafe judgment in this situation" (STS-AD item 5,
    reverse-keyed; schema sts_ad_item_05). The study used three of the six STS-AD items
    (Performance, Judgement, Reaction). Not the Faas et al. perceived-safety scale.
- study: 3d_display_comp_vehicle
  columns: [performbetter]
  verdict: wrong_dv
  target: sts_ad_item_02
  evidence: >-
    Colley et al. MUM '23 (DOI 10.1145/3626705.3627786; full text at uni-ulm.de/.../MUM_2023_3D_Display_final_compressed.pdf), sec. 3.3 Measurements: the STS-AD Performance item, "I would have performed better than the automated
    vehicle in this situation" (STS-AD item 2, reverse-keyed); not NASA-TLX performance.
- study: 3d_display_comp_vehicle
  columns: [drivingstyle]
  verdict: not_a_dv
  evidence: >-
    Colley et al. MUM '23 (DOI 10.1145/3626705.3627786; full text at uni-ulm.de/.../MUM_2023_3D_Display_final_compressed.pdf), sec. 3.3 Measurements: a self-developed item, "How would you rate the driving style of the automated
    vehicle?" (1 = completely safe to 7 = completely dangerous), listed with the study's
    capability ratings; not an STS-AD item. The closest schema DV, perceived_risk, is a risk
    rating of the situation (VAS), not a rating of the vehicle's driving style.

