- study: fact_av
  columns: [pintention]
  verdict: not_a_dv
  evidence: >-
    FACT-AV's paper is not published (README: citation 'once the paper is out of review'), so the wording is taken from the same lab's item set with the same LimeSurvey codes: the 3D display study (MUM '23, sec. 3.3, codes confirmed by 3d-comp-vehicle.R) and Colley et al. IMWUT 2022 (DOI 10.1145/3534609), sec. 4.3: "The automated vehicle predicts all pedestrian intentions in every scene
