# --- fact_av (data/all_combined_prepared.xlsx; README "Data Schema"; scores checked on the data) ---
- study: fact_av
  columns: [SART1, SART2, SART3]
  verdict: wrong_dv
  target: sart_demand
  evidence: >-
    Checked on all_combined_prepared.xlsx (cache): the file's Demand column equals SART1 +
    SART2 + SART3 on every row (the lab's 10-D SART, as in 3d-comp-vehicle.R l.53-58).
- study: fact_av
  columns: [SART4, SART5, SART6, SART7]
  verdict: wrong_dv
  target: sart_supply
  evidence: Checked on the data (cache) - Supply equals SART4 + ... + SART7 on every row.
- study: fact_av
  columns: [SART8, SART9, SSART10]
  verdict: correct
  target: sart_understanding
  evidence: >-
    Checked on the data (cache): Understanding equals SART8 + SART9 + SSART10 on every row;
    SA = Understanding - (Demand - Supply). Items of the understanding subscale, as mapped in
    bvi_auditory_hav_autoui26.
- study: fact_av
  columns: [Supply]
  verdict: correct
  target: sart_supply
  evidence: Checked on the data (cache) - SART supply subscale, sum of SART4-7 (4-28).
- study: fact_av
  columns: [Trust2]
  verdict: wrong_dv
  target: tia_trust_in_automation
  evidence: >-
    README.md (cache), "Data Schema": trust is the aggregated 1-5 rating and Trust1-5 its
    "individual trust sub-scale items"; checked on the data, trust = (Trust1 + Trust2) / 2 on
    every row, the lab's two-item TiA trust subscale. Not Jian et al.'s 12-item 7-point
    scale.
- study: fact_av
  columns: [Trust4, Trust5]
  verdict: wrong_dv
  target: tia_understanding_predictability
  evidence: >-
    Checked on the data (cache): the file's predictability column equals the mean of 6 -
    Trust3, Trust4, Trust5 and 6 - Trust6 on every row, so Trust3-6 are the four TiA
    understanding/predictability items (two reverse-keyed). Not Jian et al.'s scale.
- study: fact_av
  columns: [predictability]
  verdict: correct
  target: tia_understanding_predictability
  evidence: >-
    Checked on the data (cache): the authors' TiA understanding/predictability score of
    Trust3-6. It reverses Trust3 and Trust6, but Trust3 correlates +.79 with the trust items
    and Trust4 -.41, so Trust4 (not Trust3) is the reverse-keyed item; the stored score is
    the right construct with one item keyed the wrong way.
- study: fact_av
  columns: [perceivedSafety1, perceivedSafety2, perceivedSafety3, perceivedSafety4, perceivedSafety_score]
  verdict: correct
  target: perceived_safety
  evidence: >-
    Checked on the data (cache): perceivedSafety_score = mean of perceivedSafety1-4 on every
    row, -3..+3, the Faas et al. items the lab scores as ps_score (3d-comp-vehicle.R l.70).
- study: fact_av
  columns: [unsafeJudgement]
  verdict: wrong_dv
  target: sts_ad_item_05
  evidence: >-
    FACT-AV's paper is not published (README: citation 'once the paper is out of review'), so the wording is taken from the same lab's item set with the same LimeSurvey codes: the 3D display study (MUM '23, sec. 3.3, codes confirmed by 3d-comp-vehicle.R) and Colley et al. IMWUT 2022 (DOI 10.1145/3534609), sec. 4.3: unsafeJudgement is the STS-AD Judgement item ("The automated vehicle made an
    unsafe judgment in this situation", 1-7, reverse-keyed); not perceived safety.
- study: fact_av
  columns: [performbetter]
  verdict: wrong_dv
  target: sts_ad_item_02
  evidence: >-
    FACT-AV's paper is not published (README: citation 'once the paper is out of review'), so the wording is taken from the same lab's item set with the same LimeSurvey codes: the 3D display study (MUM '23, sec. 3.3, codes confirmed by 3d-comp-vehicle.R) and Colley et al. IMWUT 2022 (DOI 10.1145/3534609), sec. 4.3: performbetter is the STS-AD Performance item ("I would have performed better than
    the automated vehicle in this situation", 1-7, reverse-keyed); not NASA-TLX performance.
- study: fact_av
  columns: [reactapprop]
  verdict: wrong_dv
  target: sts_ad_item_06
  evidence: >-
    FACT-AV's paper is not published (README: citation 'once the paper is out of review'), so the wording is taken from the same lab's item set with the same LimeSurvey codes: the 3D display study (MUM '23, sec. 3.3, codes confirmed by 3d-comp-vehicle.R) and Colley et al. IMWUT 2022 (DOI 10.1145/3534609), sec. 4.3: the STS-AD Reaction item ("The automated vehicle reacted appropriately to the
    environment", 1-7; reacted_appropriate in the 3D display study); not TiA propensity to
    trust, which is a trait scale.
- study: fact_av
  columns: [drivingstyle]
  verdict: not_a_dv
  evidence: >-
    FACT-AV's paper is not published (README: citation 'once the paper is out of review'), so the wording is taken from the same lab's item set with the same LimeSurvey codes: the 3D display study (MUM '23, sec. 3.3, codes confirmed by 3d-comp-vehicle.R) and Colley et al. IMWUT 2022 (DOI 10.1145/3534609), sec. 4.3: driving style of the automated vehicle, 1 = completely safe to 7 = completely
    dangerous, a self-developed item; not STS-AD trust.
- study: fact_av
  columns: [complex]
  verdict: unclear
  llm_dv_ruled_out: true
  missing: >-
    the wording of `complex` (1-5) in FACT-AV's own questionnaire; the paper is not published.
    In the lab's IMWUT 2022 study the same code is "I found the visualizations unnecessarily
    complex" (1-5), one of two items adapted from the SUS, which would make it an adapted SUS
    item 2. Either way it is not the 7-point STS-AD trust composite.
  evidence: >-
    FACT-AV's paper is not published (README: citation 'once the paper is out of review'), so the wording is taken from the same lab's item set with the same LimeSurvey codes: the 3D display study (MUM '23, sec. 3.3, codes confirmed by 3d-comp-vehicle.R) and Colley et al. IMWUT 2022 (DOI 10.1145/3534609), sec. 4.3; README.md (cache) has no column definitions for it.
- study: fact_av
  columns: [expected]
