# Held-out mapping for music_intensity_driving_2021 (docs/preregistration_heldout_relations.md).
# Paper: "Psychological and psychophysiological effects of music intensity and lyrics on simulated
#   urban driving", Transportation Research Part F 2021, DOI 10.1016/j.trf.2021.05.022.
# Data: figshare 13385834 (DOI 10.6084/m9.figshare.13385834), CC-BY-4.0. No codebook; written from
#   the SPSS variable names (no variable labels except for derived z-scores and residuals) and
#   value ranges, read with pyreadstat.
# File: Music and Simulated Urban Driving Dataset.sav, one row per driver (34), WIDE: six drives
#   as column prefixes (LyrLou, LyrSof, NonLyrLou, NonLyrSof = music with/without lyrics, loud/soft;
#   ConUrb, ConTalk = urban noise and talk-radio controls). Because the drives are columns, the
#   pipeline averages each measure over drives and the study enters between-person relations only.
# <Drive>NASA1..6: NASA-TLX subscales on 0-20 in the standard order (mental, physical, temporal,
# performance, effort, frustration; the order is not stated); <Drive>NASAScore: total (40-1720,
# weighted). AG/Valence and Arousal: affect-grid ratings (1-9). MentEff / Eff: Rating Scale Mental
# Effort (0-150). MeanHR, RMSSD: heart rate and HRV per drive.

