# Held-out mapping for ar_pedestrian_outdoor_2024 (docs/preregistration_heldout_relations.md).
# Paper: Aleva, Tabone, Dodou & De Winter, "Augmented reality for supporting the interaction
#   between pedestrians and automated vehicles: an experimental outdoor study", Frontiers in
#   Robotics and AI 2024, DOI 10.3389/frobt.2024.1324060.
# Data: 4TU (DOI 10.4121/a1f9f15c-1213-4657-8e4d-a154a725d747.v1), CC-BY-4.0; codebook is readme.txt;
#   question texts are in the second row of the Qualtrics export.
# File: Data/Questionnaires-Interviews/Post-experiment questionnaire.xlsx, one row per
#   participant; the four AR interfaces are asked in four blocks of the same questions (Q12.x,
#   Q35-Q41, Q42-Q48, Q49-Q55). The second row (question texts) is read as data and is not numeric.
#   Left out: the button-press logs (log folders), Participant means.xlsx (derived, two-row
#   header), Post-hoc comparisons.xlsx (test statistics), the per-participant intuitiveness
#   sheets, the MISC and pre-experiment workbooks.
# Q*_5 "I trust the interface to make a decision ..." -> trust_rating; "How clear (understandable)
# was the interface" -> understanding_rating; "How visually attractive" -> aesthetics_rating;
# the nine acceptance differentials -> Van der Laan items in their published order.

