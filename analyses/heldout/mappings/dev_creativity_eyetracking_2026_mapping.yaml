? "15. Mental Demand : How much mental and perceptual activity was required (e.g., thinking, deciding, calculating, remembering, looking, searching, etc)? Was the mission easy or demanding, simple or complex, exacting or forgiving? \n (0 = Very Low –  100 = Very High)"
: mental_demand
? "16. Physical Demand : How much physical activity was required (e.g., pushing, pulling, turning, controlling, activating, etc.)? Was the mission easy or demanding, slow or brisk, slack or strenuous, restful or laborious? \n (0 = Very Low –  100 = Very High)"
: physical_demand
? "17. Temporal Demand : How much time pressure did you feel due to the rate or pace at which the mission occurred? Was the pace slow and leisurely or rapid and frantic? \n (0 = Very Low –  100 = Very High)"
: temporal_demand
? "18. Performance Demand : How successful do you think you were in accomplishing the goals of the mission? How satisfied were you with your performance in accomplishing these goals? \n (0 = Very Low –  100 = Very High)"
: performance
? "19. Effort : How hard did you have to work (mentally and physically) to accomplish your level of performance? \n (0 = Very Low –  100 = Very High)"
: effort
? "20. Frustration : How discouraged, stressed, irritated, and annoyed versus gratified, relaxed, content, and complacent did you feel during your mission? \n (0 = Very Low –  100 = Very High)"
: frustration
