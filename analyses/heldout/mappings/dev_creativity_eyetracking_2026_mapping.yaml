# Held-out mapping for dev_creativity_eyetracking_2026 (docs/preregistration_heldout_relations.md).
# Paper: "Creative Minds at the Keyboard: Eye-Tracking Insights into Developers' Creativity"
#   (CHASE 2025/2026), DOI 10.1145/3794860.3794891.
# Data: figshare 31198108 (DOI 10.6084/m9.figshare.31198108), CC-BY-4.0; codebook is README.md.
# Files: post-questionnaire.csv (one row per participant, NASA-TLX subscales as question text),
#   NASA_TLX_Scores.csv (raw TLX total), creativity-score-groups.csv, agg_metrics_codeGrits_*.csv
#   (IDE interaction), task1-final.csv / task2-final.csv (eye tracking per area of interest).
#   One row per participant except the eye-tracking files. task-metrics.xlsx (programming-strategy
#   metrics) is left out by the manifest.
# Post-questionnaire keys are copied from the file's header row (question text, stripped of
# surrounding spaces as the pipeline reads it). Questions 15-20 are the NASA-TLX subscales on 0-100.
# The creativity tests (DAT, RAT, TTCT) are person characteristics here (the study's grouping
# variables) and get meta_trait_* / meta_group_* labels.

