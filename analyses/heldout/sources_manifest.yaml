# Batch manifest of the held-out confirmation set (docs/preregistration_heldout_relations.md).
# Files: analyses/heldout/sources.yaml, downloaded and verified with
#   python -m opendv.analysis.confirmatory fetch --sources analyses/heldout/sources.yaml --data-dir data/raw/heldout
# Mappings: analyses/heldout/mappings/ (frozen with this file). Study designs: schemas/study_designs.yaml.
#
# 19 of the 29 held-out datasets are kept. Dropped under the pre-registered rules:
#   before download (no participant-level table the pipeline reads; analyses/heldout/sources.yaml):
#     driver_trust_index_2026: no participant-level table the pipeline reads; other files: 28 .png
#     ehmi_flash_text_2023: no participant-level table the pipeline reads; other files: 1512 .vcl, 216 .csv in log folders, 84 .mp4, 65 .png, 61 .pyd, 53 .dat
#     ehmi_gimmick_2022: no participant-level table the pipeline reads; other files: 4 .png, 3 .mat, 2 .m
#     ehmi_location_2019: no participant-level table the pipeline reads; other files: 73 .mp4, 61 .edf, 61 .txt, 5 .m, 1 .mat, 1 .docx
#     partial_automation_ui_2024: no participant-level table the pipeline reads; other files: 110 .mat
#   after download:
#     cyclist_av_decisions_2022: the downloaded surveys hold no DV; the brake/continue decisions are only in raw jsPsych exports, and no schema DV fits them
#     ehmi_behaviour_crowd_2021: the downloaded survey holds no DV; the keypress data are only in .mat files and raw exports over 50 MB
#     ehmi_colours_crowd_2020: the downloaded survey holds no DV; the colour ratings are only in raw jsPsych exports without headers, and no schema DV fits them
#     ped_gesture_vr_2021: every DV in the tables (difficulty of predicting the AV, assurance of being seen, rankings) is outside the schema
#     tactile_dvi_braking_2026: cannot be downloaded (Dryad answers HTTP 401 to the API and 403 to the public link)
sources:
- source_id: ai_label_trust_2025
  source_type: local_path
  location: data/raw/heldout/ai_label_trust_2025
  publication_doi: 10.1038/s41598-025-85558-2
  license: CC-BY-4.0
  include_globs:
  - Data/ANON_Trust_in_AI_Main_Study.csv
  mapping_path: analyses/heldout/mappings/ai_label_trust_2025_mapping.yaml
  override_standard_aliases: true
