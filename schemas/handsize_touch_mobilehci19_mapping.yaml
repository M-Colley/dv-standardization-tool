# Source-specific column mapping for handsize_touch_mobilehci19
# Paper: Larsen et al. "The Influence of Hand Size on Touch Accuracy."
#   MobileHCI 2019. DOI 10.1145/3338286.3340115
# Data: GitHub henningpohl/hcidata @ fad8f707, CC-BY-4.0. Codebooks: R/HandSize.R,
#   man/HandSize.Rd (roxygen field descriptions) and data-raw/HandSize.R (column types).
#
# File covered: data-raw/HandSize.csv (trial level; 27 participants x 2 phones x
#   500 trials = 27,000 rows). No table options needed (UTF-8 CSV, comma).
# Not in this source: data-raw/HandSizeParticipants.csv (hand measurements,
#   demographics) and data-raw/HandSizeDevices.csv (screen size/dpi) are referenced
#   by data-raw/HandSize.R but were not downloaded.
#
# Notes:
#   - Phone is the within-subject device factor (Android / iPhone, 500 trials each).
#   - Outlier (True/False) flags trials whose selection was too fast or too slow
#     (703 of 27,000: 647 on the Android, 56 on the iPhone; man/HandSize.Rd).
#     SelectionTimeSeconds ranges 0.0006-27.4 s with them, 0.21-2.62 s without.
#     Those trials are left out (exclude_rows below, applied before anything
#     else), so 26,297 trials remain; the count is in the table's -quality.json
#     (rows_excluded).
#   - ErrorMM is the touch's offset from the target in mm: the Euclidean distance
#     between (TouchX, TouchY) and (TargetX, TargetY) times a fixed pixel pitch per
#     phone (checked on the data: 0.0493 mm per px on the Android, 0.0779 on the
#     iPhone). It maps to touch_offset (schema 3.3, 2026-11-07), as does
#     road_bumps_touch's TouchOffset; one value per trial.
#   - With the outlier trials, the mean ErrorMM would be 4.47 mm instead of 3.19
#     (flagged trials average 52.5 mm), mostly on the Android (5.78 instead of
#     3.32 mm; iPhone 3.17 instead of 3.06 mm); mean SelectionTimeSeconds 0.647
#     instead of 0.640 s.
#   - TouchX/TouchY (touch position, px) are not DVs on their own. They get meta_*
#     ids like the target position, so every column is mapped and the LLM is not
#     asked: with touch_offset in the schema it could take a px position for the
#     offset, and one LLM column of a DV makes the study's DV LLM-deduced.

# --- Dependent measures -------------------------------------------------------
SelectionTimeSeconds: task_completion_time   # time to make the selection, seconds
ErrorMM: touch_offset               # distance of the touch from the target centre, mm

# --- Participants, trials, conditions -----------------------------------------
PID: meta_participant_id
Trial: meta_trial_number            # 0-499 within participant x phone
Phone: meta_condition_device        # Android / iPhone

# --- Stimulus and response position --------------------------------------------
TargetX: meta_target_position_x     # target centre, px
TargetY: meta_target_position_y     # target centre, px
TouchX: meta_touch_position_x       # touch position, px
TouchY: meta_touch_position_y       # touch position, px

# --- Data quality --------------------------------------------------------------
Outlier: meta_outlier_flag          # trial excluded as too fast / too slow

exclude_rows:
  - column: Outlier
    values: [true]
    reason: >-
      trials the authors flagged as outliers because the selection was too fast
      or too slow (man/HandSize.Rd); 703 of 27,000
