# Source-specific column mapping for music_tempo_taskload_2022
# Paper: "Interactive Effects of Task Load and Music Tempo on Psychological, Psychophysiological
#   and Behavioural Outcomes During Simulated Driving." Ergonomics (2022).
#   DOI 10.1080/00140139.2021.2003872
# Data: figshare 13348046 (DOI 10.6084/m9.figshare.13348046), CC-BY-4.0. No codebook; written
#   from the SPSS variable names (only the heart-rate variables and Personality carry labels)
#   and value ranges, read with pyreadstat.
#
# File: Task Load and Music Tempo in Simulated Driving.sav, one row per driver (46), WIDE: six
#   drives as column prefixes, task load (HL = high, LL = low) x music (FM = fast tempo, SM =
#   slow tempo, NM = no music), within subjects. Because the drives are columns, the pipeline
#   averages each measure over drives and the study enters between-person relations only.
#
# Notes (same lab and variable scheme as the held-out music_intensity_driving_2021):
#   - <Drive>_TLX_MenD/PhyD/TemD/Perf/Eff/Frus: NASA-TLX subscales, 0-20 (values up to 17).
#   - <Drive>_Aff_Ple / _Aff_Aro: affect-grid pleasure and arousal, 1-9 -> valence, arousal.
#   - <Drive>HRAve, <Drive>RMSSD: mean heart rate (bpm) and RMSSD (ms) per drive.
#   - HLNM*_A repeats the HLNM heart-rate block (HLNMHRMax_A has 986 where HLNMHRMax has a
#     plausible value), so only the HLNM* block is mapped.
#   - Beh_<Drive>_Ped/Garb/Traf/Car (0-4) are presumably behavioural responses to four
#     hazard types (pedestrian, garbage, traffic light, car), and <Drive>_WordSrch the
#     word-search score; neither is documented, so both are left unlabelled.

# --- Participants and demographics ------------------------------------------------
Pp: meta_participant_id
Personality: meta_trait_extraversion_group     # 1 = introvert, 2 = extravert (variable label)
AgeGroup: meta_demographic_age_group
Age: meta_demographic_age
Sex: meta_demographic_sex
Height: meta_demographic_height
Weight: meta_demographic_weight
PreHR: meta_baseline_hr_pre
RestHR: meta_baseline_hr_rest

# Left unlabelled (no schema DV or undocumented): Beh_* hazard counts, *_WordSrch, the other
# heart-rate statistics (*HRMin, *HRMax, *SDNN) and the duplicated HLNM*_A block.

