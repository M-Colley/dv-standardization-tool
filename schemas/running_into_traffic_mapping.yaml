# Source-specific column mapping for running_into_traffic (Zenodo 18344381)
# Paper: Al-Taie, Goodge, Macdonald, Oakley, Brewster (CHI 2026).
#   "Running into Traffic: Investigating External Human-Machine Interfaces for
#    Automated Vehicle-Runner Interaction." DOI 10.1145/3772318.3790401
#
# Two CSVs are shipped:
#   running_questionnaire.csv — per-trial Likert/NASA-TLX/UEQ-S responses
#   running_ranking.csv       — per-participant condition rankings (separate analysis)
#
# This mapping handles running_questionnaire.csv. The ranking file's columns
# encode condition rankings (e.g. "Overall - LightRing"), which are not direct
# DV scores, so they remain unmapped on purpose.

# --- NASA-TLX subscales -------------------------------------------------------
tlx.mental: mental_demand
tlx.physical: physical_demand
tlx.rush: temporal_demand        # "rush" = time pressure
tlx.success: performance         # "success" = the TLX performance subscale (reverse-keyed, see below)
tlx.effort: effort
tlx.stress: frustration          # "stress" = the TLX frustration subscale

# --- Trust / Safety / Risk constructs -----------------------------------------
safety: perceived_safety
trust: trust_rating
risk: perceived_risk

# --- AV-specific perception measures ------------------------------------------
av.intent: understanding_rating  # understanding what the AV intends to do

# --- UEQ-Short (8 items, 7-point) -------------------------------------------
# Mapped to the UEQ-S items of the instrument registry (schemas/instruments.yaml,
# Schrepp et al. 2017), which scores pragmatic quality (items 1-4) and hedonic
# quality (items 5-8) as ueq_pragmatic / ueq_hedonic on -3..+3. Item order:
# 1 obstructive-supportive, 2 complicated-easy, 3 inefficient-efficient,
# 4 confusing-clear, 5 boring-exciting, 6 not interesting-interesting,
# 7 conventional-inventive, 8 usual-leading edge.
ueq.p.support: ueq_s_1
ueq.p.ease: ueq_s_2
ueq.p.efficiency: ueq_s_3
ueq.p.clarity: ueq_s_4
ueq.h.excite: ueq_s_5
ueq.h.interest: ueq_s_6
ueq.h.inventive: ueq_s_7
ueq.h.novelty: ueq_s_8

# clarity and inventive correlate negatively with every other UEQ item in
# this dataset (row level r = -0.13 to -0.64; e.g. clarity vs. efficiency
# -0.64, inventive vs. interest -0.51), while all other pairs are positive.
# These are the two items whose positive pole comes first in the long UEQ
# ("clear - confusing", "inventive - conventional"), so the survey evidently
# kept the long-form orientation. They are reverse-scored before scoring.
reverse_items:
  - columns: ["ueq.p.clarity", "ueq.h.inventive"]
    scale_range: [1, 7]
    reason: positive pole first, as in the long UEQ; negative correlation with all other items

# tlx.success is the NASA-TLX performance subscale keyed as "success": high =
# successful, where the TLX scale runs from perfect (low) to failure (high).
# Its mean is 17.7 on 0-21 (95 of 288 answers at 21; the other five subscales
# average 3.2-4.9), it correlates negatively with all five (r = -0.19 to -0.55)
# and positively with perceived safety (0.42) and trust (0.40), and it loads
# -0.54 on a one-factor TLX model (ROADS: +0.25). The Zenodo record has no
# questionnaire to confirm the wording. Reverse-scored (21 - x) to TLX polarity.
  - columns: ["tlx.success"]
    scale_range: [0, 21]
    reason: TLX performance keyed as success (high = good); mean 17.7 of 21, negative correlation with the other TLX subscales, loading -0.54

# --- Independent variables and ambiguous non-DV columns -----------------------
# These appeared as wrong LLM targets in earlier runs (e.g. ehmi -> temporal_demand,
# instruction -> frustration). Identity-mapping locks them in as schema-mapped
# so the LLM never sees them. They will appear in meta_view as their own
# canonical names — clearly not DVs — and downstream consumers can filter them.
# participant is already auto-blocked by NEVER_MAP_NORMALIZED_COLUMNS.
speed: meta_condition_speed
yielding: meta_condition_yielding
ehmi: meta_condition_ehmi
av.aware: av_awareness
behaviour.reliance: reliance_behaviour
instruction: instruction_clarity
