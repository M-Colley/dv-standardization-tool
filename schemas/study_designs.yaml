# Study designs: which columns identify participants and experimental
# conditions in each standardized study, and how condition levels map onto
# canonical independent variables (IVs).
#
# Read by analyses/contrast_meta_analysis.py. Keys under `studies` are the
# study keys of the standardized output (the manifest `source_id`).
#
# Study entry
#   participant: column with the participant identifier (one or more names;
#                the first present column wins, so a study whose files use
#                different spellings can list them all)
#   participant_from_file: optional regular expression with one group that
#                takes the participant id from the file name for rows that
#                carry none (e.g. '_u_(\d+)_' for per-participant folders)
#   participant_scope: study (default) | file. With `file`, ids are only
#                unique within one standardized file (e.g. "1"-"12" restart in
#                every experiment's file) and are qualified by the file name.
#   domain:      research area (automotive | other), used to split pooled
#                construct relations (analyses/construct_relations.py)
#   trial / timepoint: optional columns, recorded for provenance
#   factors: list of manipulated IVs
#     name:      study-level name of the factor
#     canonical: optional id from `canonical_factors`; only factors with a
#                canonical id are pooled across studies
#     design:    within | between (verified against the data; a mismatch is
#                reported in contrast_effects.csv as design_observed)
#     columns:   {column: {raw value: study level}} or {column: null} to use
#                the stripped raw value as the level. When several columns
#                are listed, the first non-missing one gives a row's level
#                (e.g. survey files that only carry a condition code).
#     levels:    {study level: canonical level}; required with `canonical`
#     reference: study level that every other level is contrasted against;
#                defaults to the level(s) mapped to the canonical reference
#     exclude:   optional {column: [values]}: rows whose value in that column is
#                listed carry no level of this factor, e.g. measurements taken
#                before the manipulation, or events in which the factor was not
#                crossed with the others (rows without a value are kept)
#   source:      where the design information comes from
#
# Effects are condition contrasts (level minus reference) computed on
# participant means: Hedges' g for between-subjects factors, and the
# standardized mean change with raw-score (pooled) standardization for
# within-subjects factors (metafor measure "SMCRPH"), so both are on the
# same d metric and can be pooled.

version: "1.2"
updated: "2026-11-06"

canonical_factors:
  ehmi_presence:
    label: External HMI present vs. absent
    levels: [absent, present]
    reference: absent
    notes: >-
      Any external communication of the automated vehicle (light band, light
      ring, text or intention display) against the same vehicle without one.
  display_dimensionality:
    label: 3D vs. 2D in-vehicle display
    levels: [2d, 3d]
    reference: 2d
  task_demand:
    label: Higher vs. lowest task demand
    levels: [lowest, higher]
    reference: lowest
    notes: >-
      More of the same task at once, or a harder version of it: more vehicles requesting
      remote help at once, two speech streams at once instead of one after the other, a
      faster video, a noisier cursor, a smaller view or a hidden path, a more complex
      scenario. Tagged only where the study's README, analysis script or paper states the
      direction, never from the outcomes; whether the manipulation raised workload is what
      the contrast estimates. Added distractions (another stimulus, not more of the task)
      and levels the record does not define are not tagged. Added 2026-11-06.
  situation_criticality:
    label: More vs. least critical traffic encounter
    levels: [lowest, higher]
    reference: lowest
    notes: >-
      The other vehicle's behaviour brings the encounter closer to a collision: a smaller
      merging gap, harder braking of the merging vehicle, an automated vehicle that does not
      yield to a crossing pedestrian. Added 2026-11-06.

studies:
  running_into_traffic_chi26:
    participant: participant
    domain: automotive
    source: >-
      running_questionnaire.csv column names; every participant saw all 12 cells. An AV that
      does not yield is tagged situation_criticality (2026-11-06).
    factors:
      - name: ehmi
        canonical: ehmi_presence
        design: within
        columns: {ehmi: null}
        levels: {Nothing: absent, LightRing: present, CyanBand: present}
      - name: pedestrian_speed
        design: within
        columns: {meta_condition_speed: null}
        reference: Walking
      - name: av_yielding
        canonical: situation_criticality
        design: within
        columns: {meta_condition_yielding: null}
        levels: {Yielding: lowest, Not-Yielding: higher}
        reference: Yielding

  ehmi_for_all_chi26:
    participant: [UserID, user_id]
    domain: automotive
    source: >-
      Log files carry scenario/distraction/ehmi columns; survey rows only carry
      ConditionID (A-R). The letter-to-cell mapping was derived from the log
      file names (data_Log_<user>_<letter>_time.csv) and is identical for all
      40 participants.
    factors:
      - name: ehmi
        canonical: ehmi_presence
        design: within
        columns:
          ehmi: null
          ConditionID: {A: None, C: None, E: None, G: None, I: None, K: None, M: None, O: None, Q: None,
                        B: Intention, D: Intention, F: Intention, H: Intention, J: Intention, L: Intention,
                        N: Intention, P: Intention, R: Intention}
        levels: {None: absent, Intention: present}
      - name: road_user
        design: within
        columns:
          scenario: null
          ConditionID: {A: Pedestrian, B: Pedestrian, C: Pedestrian, D: Pedestrian, E: Pedestrian, F: Pedestrian,
                        G: Driver, H: Driver, I: Driver, J: Driver, K: Driver, L: Driver,
                        M: Bicycle, N: Bicycle, O: Bicycle, P: Bicycle, Q: Bicycle, R: Bicycle}
        reference: Pedestrian
      - name: distraction
        design: within
        columns:
          distraction: null
          ConditionID: {A: None, B: None, G: None, H: None, M: None, N: None,
                        C: Noise, D: Noise, I: Noise, J: Noise, O: Noise, P: Noise,
                        E: Interference, F: Interference, K: Interference, L: Interference,
                        Q: Interference, R: Interference}
        reference: None

  3d_display_comp_vehicle:
    participant: UserID
    domain: automotive
    source: ConditionID levels LookingGlass, LumePad (lightfield / 3D) and 2D; each participant saw all three
    factors:
      - name: display
        canonical: display_dimensionality
        design: within
        columns: {ConditionID: null}
        levels: {2D: 2d, LumePad: 3d, LookingGlass: 3d}

  fact_av:
    participant: ProlificID
    domain: automotive
    source: repository README (mixed design; INTRODUCTION and SCENARIO between subjects)
    factors:
      - name: introduction
        design: between
        columns: {INTRODUCTION: null}
        reference: ambiguous
      - name: scenario
        design: between
        columns: {SCENARIO: null}
        reference: City

  longitudinal_usa_germany_ehmi:
    participant: [subject_id, userID]
    domain: automotive
    timepoint: [rep_exposure, repExposure]
    source: repeated exposure (three sessions); condition coding not documented in the data files
    factors: []

  psych_conflict_handling:
    participant: ID
    domain: automotive
    trial: meta_trial_sequence
    source: >-
      Condition codes 1-12 from get_values_based_on_condition() in the
      repository's psychological_conflict-handling_strategies.R (strategy,
      mechanism); every participant saw all 12.
    factors:
      - name: strategy
        design: within
        columns:
          Condition: {"1": Baseline, "2": Explanation, "3": Show benefit, "4": Annoyance, "5": Command,
                      "6": Threat, "7": Appeal, "8": Thanking, "9": Apologize, "10": Humorous,
                      "11": Trigger empathy, "12": Thanking submissive}
        reference: Baseline
      - name: mechanism
        design: within
        columns:
          Condition: {"1": Baseline, "2": Cognitive, "3": Cognitive, "4": Social, "5": Social, "6": Social,
                      "7": Politeness, "8": Politeness, "9": Politeness, "10": Emotional, "11": Emotional,
                      "12": Politeness}
        reference: Baseline

  roads_chi25:
    participant: UserID
    domain: automotive
    source: >-
      ConditionID 1-12 coded as in the repository's Evaluation_CHI25_ROADS.R:
      interaction concept (1/4/7/10 Trajectory, 2/5/8/11 Path planning,
      3/6/9/12 Waypoint, the script's reference level) x number of requests
      (1-3 One, 4-6 Two, 7-9 Three, 10-12 Four); every participant saw all 12. The paper
      has up to four vehicles sending requests at once, so the number of requests is tagged
      task_demand (2026-11-06).
    factors:
      - name: interaction_concept
        design: within
        columns:
          ConditionID: {"1": Trajectory, "4": Trajectory, "7": Trajectory, "10": Trajectory,
                        "2": Path planning, "5": Path planning, "8": Path planning, "11": Path planning,
                        "3": Waypoint, "6": Waypoint, "9": Waypoint, "12": Waypoint}
        reference: Waypoint
      - name: number_of_requests
        canonical: task_demand
        design: within
        columns:
          ConditionID: {"1": One, "2": One, "3": One, "4": Two, "5": Two, "6": Two,
                        "7": Three, "8": Three, "9": Three, "10": Four, "11": Four, "12": Four}
        levels: {One: lowest, Two: higher, Three: higher, Four: higher}
        reference: One

  ehmi_optimization_chi25:
    participant: User_ID
    participant_from_file: '_u_(\d+)_'   # QuestionnaireResponses files carry no id
    domain: automotive
    trial: meta_run
    factors: []

  scrolling_in_the_deep_chi25:
    participant: Participant_ID
    domain: other
    factors: []

  osf_cwd6h:
    participant: Participant ID
    domain: automotive
    factors: []

  road_bumps_touch:
    participant: meta_participant_id
    domain: automotive
    source: >-
      schemas/road_bumps_touch_mapping.yaml and the authors' ANOVA notebooks
      (Step11, Step12): 16 participants, speed x bump within subjects. The bump
      level is the ride condition in R_TCT (IsBump) and whether the touch came
      after the bump in the other tables (IsBumpVirtual), as in the paper.
    factors:
      - name: speed
        design: within
        columns: {meta_condition_speed: null}
        reference: "10"
      - name: road_bump
        design: within
        columns:
          meta_condition_bump_ride: {"0": none, "1": bump}
          meta_condition_bump_at_touch: {"0": none, "1": bump}
        reference: none

  # --- Added 2026-11-04 (development set; column names as standardized) -----
  incar_vr_gain_chi24:
    participant: meta_participant_id
    domain: automotive
    source: >-
      schemas/incar_vr_gain_chi24_mapping.yaml: PID (questionnaires) and
      ActualParticipant (reading questions) are the same ids; Condition 1-3 =
      Gain, Attenuation, Matched Motion, each participant saw all three.
    factors:
      - name: motion_manipulation
        design: within
        columns:
          Condition: {"1": Gain, "2": Attenuation, "3": Matched}
        reference: Matched

  bvi_auditory_hav_autoui26:
    participant: UserID
    domain: automotive
    source: >-
      Results sheet (35 participants x 3 conditions); infoContent Few / Medium /
      Most within subjects, VIP (Y = blind or visually impaired) between.
    factors:
      - name: information_content
        design: within
        columns: {meta_condition_label: null}
        reference: Few
      - name: visual_impairment
        design: between
        columns: {meta_condition_visual_impairment: null}
        reference: N

  av_prevalence_ehmi_autoui24:
    participant: meta_participant_id
    domain: automotive
    source: readme.html; AV_Prevalence 0 = low (21 % AVs), 1 = high (79 %), between subjects
    factors:
      - name: av_prevalence
        design: between
        columns:
          meta_condition_av_prevalence: {"0": low, "1": high}
        reference: low

  ehmi_state_intent_mtap24:
    participant: meta_participant_id
    domain: automotive
    source: README.html; 2 (eHMI state / intent) x 2 (crosswalk / roundabout) between subjects, one row per participant
    factors:
      - name: ehmi_content
        design: between
        columns: {eHMI: null}
        reference: state
      - name: environment
        design: between
        columns: {meta_condition_environment: null}
        reference: crosswalk

  av_acceptance_vr_ijhci24:
    participant: meta_participant_id
    domain: automotive
    source: EEDA_Qdata.csv; one row per respondent (uid), no condition column
    factors: []

  fido2_auth_chi23:
    participant: id
    domain: other
    source: README.md; group P = platform (Touch ID), R = roaming (YubiKey), between groups
    factors:
      - name: authentication_method
        design: between
        columns: {group: null}
        reference: P

  pairsonic_cscw24:
    participant: id
    domain: other
    source: one row per participant; both systems are wide columns (a_*, b_*), so no factor rows
    factors: []

  curved_dragging_vr_ijhci26:
    participant: [meta_participant_id, subject_id]
    participant_scope: file
    domain: other
    source: >-
      README.md: 12 participants in each experiment; behavioural files number
      them 1-12 per experiment and the NASA-TLX sheet E1_P01-E2_P12, and nothing
      links the two numberings, so ids are kept apart per file.
    factors: []

  fov_snapturn_tvcg24:
    participant: ID
    domain: other
    source: >-
      2 x 2 between subjects; the no-mitigation control has an empty Mitigation
      cell, which a factor level cannot name, so no factor is declared.
    factors: []

  handsize_touch_mobilehci19:
    participant: meta_participant_id
    domain: other
    source: 27 participants x 2 phones x 500 trials
    factors:
      - name: device
        design: within
        columns: {meta_condition_device: null}
        reference: Android

  woz_adaptation_ijhcs24:
    participant: Participant ID
    domain: other
    source: >-
      One row per participant (97), three intervals as wide columns; Group (five
      adaptation behaviours, between groups) has no control level, so no factor
      is declared.
    factors: []

  gaze_platformer_chi24:
    participant: [ID, ParticipantID]
    timepoint: meta_session_day
    domain: other
    source: CODEBOOK.md; input method Eye / Mouse between subjects x study day 1-5
    factors:
      - name: input_method
        design: between
        columns: {meta_condition_input_method: null}
        reference: Mouse

  # --- Added 2026-11-05: development half of the 2026-11-05 search ---------------
  # Participant columns on the never-map list (ID, id, user_id, participant_id,
  # RecordedDate, ...) keep their raw names. Factors are declared (2026-11-06) where the
  # condition is a column of long data; the seven studies that keep their conditions only
  # as wide columns (one column per condition and measure) describe them in `source`, since
  # a factor reads a row's level from a column.
  ehmi_car_body_2020:
    participant: meta_participant_id
    domain: automotive
    source: >-
      One row per participant (24); eight eHMI concepts (triangles, pictogram, both,
      headlight flasher x AV detected / not detected the manual driver) within subjects as
      wide columns.
    factors: []

  tlx_formats_uas_2023:
    participant: participant_id
    domain: other
    source: >-
      README.md and data_dictionary.csv; one row per participant x trial x NASA-TLX response
      type (36 x 36 x 3), all within subjects. Every participant rated the same 36 videos
      with each response type (numeric entry Ask, rotary Knob, Slider; counterbalanced
      blocks). Task difficulty was manipulated across the videos by play speed (Regular,
      Fast = 1.6x), cursor noise (Low 0 px, Medium +-6 px, High +-12 px), view radius
      (Small 25 px, Medium 50 px, Large 75 px) and path visibility; these four are balanced
      over the 36 videos (each pair of levels in equal numbers), so their marginal contrasts
      are not confounded with one another. The fifth, the number of searched points (0-6),
      is not declared: it is unbalanced (2-10 videos per value, 6 points only at Regular
      speed). Reference levels are the easier ones; Slider for the response type.
    factors:
      - name: response_type
        design: within
        columns: {meta_condition_response_type: null}
        reference: Slider
      - name: play_speed
        canonical: task_demand
        design: within
        columns: {meta_condition_play_speed: null}
        levels: {Regular: lowest, Fast: higher}
        reference: Regular
      - name: cursor_noise
        canonical: task_demand
        design: within
        columns: {meta_condition_cursor_noise: null}
        levels: {Low: lowest, Medium: higher, High: higher}
        reference: Low
      - name: view_radius
        canonical: task_demand
        design: within
        columns: {meta_condition_view_radius: null}
        levels: {Large: lowest, Medium: higher, Small: higher}
        reference: Large
      - name: path_visible
        canonical: task_demand
        design: within
        columns:
          meta_condition_path_visible: {"True": visible, "False": hidden}
        levels: {visible: lowest, hidden: higher}
        reference: visible

  tactile_sa_display_2022:
    participant: ID
    domain: automotive
    source: >-
      DaRUS dataset page (quoted in the mapping file): "assigned condition (SA-L1 = 1,
      SA-L3=2)"; one row per participant (21), between subjects: tactile notifications of
      SA level 1 (positions of surrounding traffic; 12 participants) or SA level 3
      (projection of the automated vehicle's future position; 9).
    factors:
      - name: sa_level
        design: between
        columns:
          Condition: {"1": SA level 1, "2": SA level 3}
        reference: SA level 1

  short_videos_memory_2023:
    participant: meta_participant_id
    domain: other
    source: >-
      README.md and the mapping file; one row per participant (q.csv), per participant x
      task x phase (acc.csv) or per trial (rt.csv); break activity (interrupt: rest, TikTok,
      Twitter, YouTube) between subjects, 15 each (folder ids 1xx-4xx). The break lay between
      the pre and post task blocks, so the contrast leaves out the training and pre-break
      rows (exclude) and uses the post-break measurements and the questionnaire (engagement
      during the break).
    factors:
      - name: break_activity
        design: between
        columns: {meta_condition_interruption: null}
        exclude: {meta_measurement_phase: [train, pre]}
        reference: rest

  driving_style_automated_2021:
    participant: meta_participant_id
    domain: automotive
    source: >-
      One row per participant (24); ten trajectory and eight deceleration trials within
      subjects as wide columns.
    factors: []

  ar_pedestrian_online_2023:
    participant: RecordedDate
    domain: automotive
    source: >-
      Qualtrics export without a response id, one row per respondent; RecordedDate is unique
      for all but 10 pairs of the 1,155 respondents with ratings (see the mapping file).
      Nine AR interfaces within subjects as wide columns.
    factors: []

  perceived_risk_merging_2022:
    participant: meta_participant_id
    domain: automotive
    source: >-
      README.md (REP, IMG, BI) and the data; one row per participant x event (22 x 20), all
      within subjects: nine merging-and-hard-brake events, initial merging gap (5, 15, 25 m)
      x braking intensity of the merging vehicle (-2, -5, -8 m/s^2), and one hard-braking
      event without a merge (gap column 25, intensity -8; 0 in two rows), each driven twice
      (REP 1 = first exposure, 2 = second). Gap and braking intensity are crossed only in the
      merging events, so their contrasts leave out the hard-braking event (exclude); one
      row has neither. References: the largest gap, the mildest braking, the first
      exposure.
    factors:
      - name: merging_gap
        canonical: situation_criticality
        design: within
        columns:
          meta_condition_initial_merging_gap: {"5": 5 m, "15": 15 m, "25": 25 m}
        exclude: {meta_condition_event_type: [Hard braking]}
        levels: {25 m: lowest, 15 m: higher, 5 m: higher}
        reference: 25 m
      - name: braking_intensity
        canonical: situation_criticality
        design: within
        columns:
          meta_condition_braking_intensity: {"-2": -2 m/s2, "-5": -5 m/s2, "-8": -8 m/s2}
        exclude: {meta_condition_event_type: [Hard braking]}
        levels: {-2 m/s2: lowest, -5 m/s2: higher, -8 m/s2: higher}
        reference: -2 m/s2
      - name: repetition
        design: within
        columns:
          meta_repetition: {"1": first, "2": second}
        reference: first

  ehmi_survey_crowd_2019:
    participant: id
    participant_scope: file
    domain: automotive
    source: >-
      Two independent crowdsourced surveys (1,770 and 2,000 respondents), one row per
      respondent; `id` restarts at 1 in each file, so ids are kept apart per file. eHMI
      concepts within subjects as wide columns.
    factors: []

  reflexion_mapping_2025:
    participant: meta_participant_id
    domain: other
    source: >-
      evalTLX.r; one row per participant (14); tasks with and without automated mapping
      suggestions within subjects (order by Gruppe A / B) as wide columns.
    factors: []

  sensecobot_fusion_2024:
    participant: meta_participant_id
    domain: other
    source: >-
      Readme.txt; one row per participant (Labels.csv, 21; the per-task NASA-TLX questions
      are wide columns there) or per participant x task (SenseCobotFusion.csv; Baseline and
      Tasks 1-5 with a collaborative robot, within subjects). The Baseline rows carry no
      task rating (Label), so the task contrasts cover the physiological measures only.
    factors:
      - name: task
        design: within
        columns: {meta_condition_task: null}
        reference: Baseline

  myocontrol_intent_2025:
    participant: meta_participant_id
    domain: other
    source: >-
      One row per participant x TAC level (NASA TLX.csv, 8 participants) or per TAC test
      trial (testResults.csv); TAC level and contraction intensity (Full, Half) within
      subjects. The record does not define the TAC levels; GestureDistribution.csv lists N
      gestures at TAC N for TAC 3-5 (3-7 at TAC 6-7), so a higher level controls more
      gestures. The files spell the levels "TAC 4" and "TAC_4". Not every participant reached
      every level (TAC 3 only in the trials, TAC 7 by 3-4 participants), so the reference is
      TAC 4, the lowest level in both files. Not tagged task_demand: the record does not
      define the levels.
    factors:
      - name: tac_level
        design: within
        columns:
          meta_condition_tac_level: {TAC 3: TAC 3, TAC_3: TAC 3, TAC 4: TAC 4, TAC_4: TAC 4,
                                     TAC 5: TAC 5, TAC_5: TAC 5, TAC 6: TAC 6, TAC_6: TAC 6,
                                     TAC 7: TAC 7, TAC_7: TAC 7}
        reference: TAC 4
      - name: contraction_intensity
        design: within
        columns: {meta_condition_contraction_intensity: null}
        reference: Full intensity

  artv_ornaments_2025:
    participant: meta_participant_id
    domain: other
    source: >-
      Mapping file (from the Qualtrics export's question "Which Condition did you
      experience?"); one row per participant x condition (20 x 4), within subjects: the VR
      train interior without ornamentation (Baseline) and three AR ornamentations (Constant
      Generic Medieval, Constant Game of Thrones Objects, Interior Change With Scene). The
      two header rows of the export (question text, import id) are not levels.
    factors:
      - name: ornamentation
        design: within
        columns:
          meta_condition_ornamentation: {Baseline: Baseline, Constant Generic Medieval: Constant Generic Medieval,
                                         Constant Game of Thrones Objects: Constant Game of Thrones Objects,
                                         Interior Change With Scene: Interior Change With Scene}
        reference: Baseline

  nl2tap_filter_2026:
    participant: participant_id
    domain: other
    source: >-
      README.md and participants.csv; one row per participant (questionnaires, 85) or per
      participant x scenario (510). user_type (between subjects, not randomized: the
      interface followed the participant's expertise): non-experts (45, ids user_0001-0067)
      only chatted with the system, experts (40, user_0101-0205) also saw and could edit the
      generated code. user_type is only in participants.csv, which holds no DV, so the factor
      reads it from the participant id. Non-experts did two scenarios of each complexity class
      (S1-S2 = C1, M1-M2 = C2, C1-C2 = C3), experts six expert scenarios (E1-E6, all C3):
      complexity varies within subjects for non-experts only, and the user_type contrast on
      scenario measures compares C3 scenarios only (exclude).
    factors:
      - name: user_type
        design: between
        columns:
          participant_id: {user_0001: non_expert, user_0002: non_expert, user_0003: non_expert, user_0004: non_expert,
                           user_0005: non_expert, user_0006: non_expert, user_0007: non_expert, user_0008: non_expert,
                           user_0009: non_expert, user_0010: non_expert, user_0011: non_expert, user_0013: non_expert,
                           user_0015: non_expert, user_0016: non_expert, user_0017: non_expert, user_0018: non_expert,
                           user_0019: non_expert, user_0020: non_expert, user_0021: non_expert, user_0022: non_expert,
                           user_0023: non_expert, user_0024: non_expert, user_0026: non_expert, user_0027: non_expert,
                           user_0028: non_expert, user_0029: non_expert, user_0031: non_expert, user_0032: non_expert,
                           user_0033: non_expert, user_0034: non_expert, user_0037: non_expert, user_0039: non_expert,
