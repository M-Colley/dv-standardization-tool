# Source-specific column mapping for ar_pedestrian_online_2023
# Paper: Tabone, Happee, Garcia, Lee, Lupetti, Merat, De Winter. "Augmented reality interfaces
#   for pedestrian-vehicle interactions: An online study." Transportation Research Part F
#   (2023). DOI 10.1016/j.trf.2023.02.005
# Data: 4TU (DOI 10.4121/21603678.v1), CC0-1.0; codebook is README.txt and the question texts
#   in the second row of the Qualtrics export (Questionnaire.pdf, over 20 MB, not downloaded).
#
# File: raw_data.xlsx, one row per respondent (1,500; 1,155 rated at least one interface).
#   The second row holds the question texts and is read as data (not numeric). WIDE: nine AR
#   interfaces, each shown in a video and rated in a block of the same questions, within
#   subjects. Because the interfaces are columns, the pipeline averages them per respondent
#   and the study enters between-person relations only.
#
# Notes:
#   - Same lab and item set as the held-out ar_pedestrian_outdoor_2024: "How clear
#     (understandable) was the interface to you?" -> understanding_rating, "How visually
#     attractive is this interface to you?" -> aesthetics_rating (both 1-5), and the nine
#     acceptance differentials -> Van der Laan items in their published order (1-5, left word
#     = 1: useful:useless, pleasant:unpleasant, bad:good, nice:annoying, effective:superfluous,
#     irritating:likable, assisting:worthless, undesirable:desirable, raising
#     alertness:sleep-inducing).
#   - The export has no ResponseId. RecordedDate (on the never-map list, so it keeps its raw
#     name) is the respondent key in study_designs.yaml: it is unique for all but 10 pairs of
#     respondents with ratings who submitted in the same second (20 of 1,155), whose values are
#     averaged as one.
#   - Q14_1-9 are the nine ATI items (Franke et al., 2019), labelled "Technology openness".

# --- Survey metadata ----------------------------------------------------------------
# StartDate, EndDate, Status, Progress, Duration (in seconds), Finished and RecordedDate are
# on the never-map list and keep their raw names.
UserLanguage: meta_survey_language
Q7: meta_check_instructions_understood        # 1 = yes, 2 = no

