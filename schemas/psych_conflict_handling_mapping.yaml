# Source-specific column mapping for psychological-conflict-handling-strategies
# GitHub: https://github.com/as116/psychological-conflict-handling-strategies
# Paper: Stampf, Colley, Knuth, Tasci, Rukzio (2024).
#   "Examining Psychological Conflict-Handling Strategies for Highly Automated
#    Vehicles to Resolve Legal User-Vehicle Conflicts." IMWUT. DOI 10.1145/3678511
#
# StudyResults.xlsx (sheet "Blatt 1"): 36 participants x 12 persuasion
# conditions = 432 rows. Raw cells are TEXTUAL Likert labels (English for the
# C*/ST* items, German for the A* items). `value_labels` below recodes them to
# the numeric codes of the original instruments (scripts/value_labels.py);
# without it the dataset contributes no numeric DV at all. The items the
# source analysis reverse-scores (C2, ST2, ST4, ST5, A2; *_inv in the paper's
# scripts) are reversed by `reverse_items` at the end of this file, so every
# item is keyed in the direction of its construct.

# --- Perceived conflict with the AV's decision (5 items, 5-point) -------------
C1: conflict_item_01
C2: conflict_item_02   # reverse-scored in the source analysis (C2_inv)
C3: conflict_item_03
C4: conflict_item_04
C5: conflict_item_05

# --- STS-AD: Situational Trust Scale for Automated Driving (6 items, 7-point) -
ST1: sts_ad_item_01
ST2: sts_ad_item_02    # reverse-scored (ST2_inv)
ST3: sts_ad_item_03
ST4: sts_ad_item_04    # reverse-scored (ST4_inv)
ST5: sts_ad_item_05    # reverse-scored (ST5_inv)
ST6: sts_ad_item_06

# --- Study-specific items (German Likert) -------------------------------------
A1: task_feasibility_item_01
A2: task_feasibility_item_02   # reverse-scored (A2_inv)
A3: perceived_vehicle_influence
A4: acceptance_rating

# --- Trial order (independent / admin) ----------------------------------------
# Identity-mapped to a meta_* field so it is locked as schema-mapped and never
# reaches the LLM step. ID and Condition are auto-blocked by the runner's
# NEVER_MAP_NORMALIZED_COLUMNS set, so they need no entry here.
Sequence: meta_trial_sequence

# --- Text label -> numeric code -----------------------------------------------
value_labels:
  - columns: [C1, C2, C3, C4, C5]          # 5-point agreement
    labels:
      Do not agree at all: 1
      Rather disagree: 2
      Neither: 3
      Rather agree: 4
      Fully agree: 5
  - columns: [ST1, ST2, ST3, ST4, ST5, ST6]  # STS-AD 7-point agreement
    labels:
      Strongly disagree: 1
      Disagree: 2
      Mildly disagree: 3
      Neutral: 4
      Mildly agree: 5
      Agree: 6
      Strongly agree: 7
  - columns: [A1, A2, A3, A4]              # German 5-point agreement
    labels:
      Stimme gar nicht zu: 1
      Stimme eher nicht zu: 2
      Weder noch: 3
      Stimme eher zu: 4
      Stimme voll zu: 5

# --- Reverse-scored items (as in the source analysis) -------------------------
reverse_items:
  - columns: [C2, A2]
    scale_range: [1, 5]
    reason: reverse-scored in the source analysis (C2_inv, A2_inv)
  - columns: [ST2, ST4, ST5]
    scale_range: [1, 7]
    reason: reverse-scored in the source analysis (ST2_inv, ST4_inv, ST5_inv)
