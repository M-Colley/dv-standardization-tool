# Source-specific column mapping for driving_style_automated_2021
# Paper: Bazilinskyy, Sakuma, De Winter. "What driving style makes pedestrians think a passing
#   vehicle is driving automatically?" Applied Ergonomics (2021). DOI 10.1016/j.apergo.2021.103428
# Data: 4TU (DOI 10.4121/14077352.v2), CC0-1.0; codebook is readme.txt and the questionnaire
#   forms (forms/2. Questionnaire after trajectory trial.pdf, forms/4. ... deceleration trial.pdf).
#
# File: supplementary materials/data.xlsx, one row per participant (24), WIDE: ten trajectory
#   trials (t1-t10) and eight deceleration trials (d1-d8) as column blocks, within subjects.
#   Rows 25-38 hold the code legends (e.g. "1 = Male") and no participant. The comment files,
#   the t-test tables (stats_*.xlsx) and the trial order (trials_mapping.xlsx) are left out.
#
# Notes:
#   - After each trial the pedestrian rated, on five-point semantic differentials, how
#     automated the car was and five Godspeed items (Bartneck et al., 2009): machine-like vs
#     human-like (anthropomorphism), mechanical vs organic (animacy), dislike vs like
#     (likeability), unintelligent vs intelligent (perceived intelligence) and anxious vs
#     relaxed (perceived safety). Each item is mapped to its Godspeed subscale; one item per
#     subscale and trial.
#   - Header spelling is kept as in the file ("oganic"); trailing spaces are stripped by the
#     batch, so "How automated was the car ? " is listed without them.
#   - Because the trials are columns, the pipeline averages them per participant and the study
#     enters between-person relations only.

# --- Participants and demographics ------------------------------------------------
Participant: meta_participant_id
Session: meta_session                                         # 1-3, groups of participants
Gender (1=male, 2=female): meta_demographic_gender
Age: meta_demographic_age
Primory mode of transportation: meta_demographic_transport_mode
"Transportation: other": meta_demographic_transport_mode_other
How often did you drive a vehicle in the last 12 months?: meta_demographic_driving_frequency
How many km did you drive in the last 12 months?: meta_demographic_driving_distance

# Left unlabelled (no schema DV): "tN. / dN. How automated was the car ?" (perceived
# automation, 1-5).

# --- Dependent measures per trial: Godspeed items (1-5) ----------------------------
t1. Machine-like vs human-like: godspeed_anthropomorphism
t1. Mechanical vs oganic: godspeed_animacy
t1. Dislike vs like: godspeed_likeability
t1. Unintelligent vs Intelligent: godspeed_perceived_intelligence
t1. Anxious vs Relaxed: godspeed_perceived_safety
