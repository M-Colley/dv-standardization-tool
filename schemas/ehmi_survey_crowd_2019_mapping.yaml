# Source-specific column mapping for ehmi_survey_crowd_2019
# Paper: Bazilinskyy, Dodou, De Winter. "Survey on eHMI concepts: The effect of text, color,
#   and perspective." Transportation Research Part F (2019). DOI 10.1016/j.trf.2019.10.013
# Data: 4TU (DOI 10.4121/uuid:9ea78136-3ffc-4194-84f7-3116b6a55758), CC0-1.0; codebook is
#   data/readme.txt; the questions are the column names (Figure-Eight export).
#
# Files: data/Survey 1/data_s1.xlsx (1,770 respondents) and data/Survey 2/data_s2.xlsx (2,000
#   respondents), one row per respondent, two independent crowdsourced surveys. Worker ids and
#   IP addresses are masked; `id` numbers the respondents from 1 in each file, so participant
#   ids are kept apart per file (study_designs.yaml, participant_scope: file).
#
# Notes:
#   - Survey 1: 28 eHMI concepts (images and videos) in random order; per position N the
#     column fileN records the concept shown, followed by "The instructions of the car in
#     concept N above are clear to me" (5-point agreement, text labels; -> understanding_rating)
#     and a free-text question on the message.
#   - Survey 2: 15 text eHMIs varying in message, colour and perspective; per concept "Would
#     you feel safe to cross in front of the car above?" (Yes / Not sure / No; ->
#     perceived_safety on -1..1, value_labels below), a free-text explanation and a check of
#     the text colour. Because the right answer depends on the message ("Walk" vs "Don't
#     walk"), the respondent mean mixes feeling safe with following the message.
#   - "I prefer not to respond" is read as missing (missing_values below).
#   - The six statements on trusting machines are the propensity-to-trust scale (Merritt et
#     al., 2013), measured once per respondent as a trait.

