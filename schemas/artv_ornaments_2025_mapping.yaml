Q5_8: engagement_level
Q5_9: engagement_level
Q5_10: engagement_level
Q5_11: engagement_level
Q5_12: engagement_level
# UEQ-S scale means, -3..3
UEQ_SF_Pragmatic: ueq_pragmatic
UEQ_SF_Hedonic: ueq_hedonic

