# Source-specific mapping for roads_chi25 (github.com/M-Colley/roads-chi25-data)
# Paper: Colley et al. (CHI 2025), DOI 10.1145/3706598.3713476.
#
# Columns are mapped by the standard schema aliases; this file only declares
# how the Van der Laan items are keyed.
#
# Van der Laan acceptance (aoa1..aoa9, LimeSurvey -2..2 with neg1/neg2): +2 is
# the first word of each item (useful, pleasant, bad, ...), the opposite of the
# instrument registry's [-2, 2] coding (-2 = first word,
# schemas/instruments.yaml). Evidence: aoa1 correlates +0.76 with the SUS score
# of the same answers, and the registry's usefulness and satisfying scores
# without this reversal correlate -0.81 and -0.83 with it. The same lab's
# eHMI-for-All script also scores high aoa1 as useful. The study's own script
# (Evaluation_CHI25_ROADS.R) uses (3 - aoa1), the formula for 1-5 answers with
# 1 = first word, on these -2..2 answers, so its scores are offset and reversed.
# Reversing all nine items puts them on the registry's coding.
reverse_items:
  - columns: [aoa1, aoa2, aoa3, aoa4, aoa5, aoa6, aoa7, aoa8, aoa9]
    scale_range: [-2, 2]
    reason: +2 = first word of each item; the registry's [-2, 2] coding has -2 = first word
