# Source-specific column mapping for fov_snapturn_tvcg24
# Paper: Kelly, Doty, Gilbert, Dorneich. "Field of View Restriction and Snap
#   Turning as Cybersickness Mitigation Tools." IEEE Transactions on Visualization
#   and Computer Graphics (2025). DOI 10.1109/TVCG.2024.3470214
# Data: OSF project d4zyf (https://osf.io/d4zyf/), CC-BY-4.0. The project holds
#   Data/FOV&SnapTurnDataOSF_Revision.csv, Supplemental analyses/
#   SupplementalAnalyses_Revision2.pdf and Supplemental figures/{logSSQ_Revision.pdf,
#   VRNQ_Full_Revision.pdf}; there is no codebook, so meanings below were settled
#   from the paper (accepted manuscript, NSF PAR 10591601), the VRNQ supplemental
#   table and checks on the data.
#
# File covered: Data/FOV&SnapTurnDataOSF_Revision.csv, one row per participant
#   (N = 201, 2 x 2 between-subjects design).
# Table options: the file is Windows-1252, not UTF-8 (byte 0x92 in a free-text
#   answer); read with pd.read_csv(path, encoding="cp1252"). The loader's encoding
#   detection fails on it. "N/A" strings are read as missing.
#
# Notes:
#   - Mitigation is empty (NaN) for the 52 no-mitigation control participants.
#   - "FMS" here is an 11-point 0-10 sickness rating modelled on the 21-point Fast
#     Motion Sickness scale (paper, Sec. 4.3). Ratings every 4 min (FMS0..FMS20,
#     missing after early withdrawal) and on exiting VR (Final FMS; Early FMS only
#     for participants who withdrew). ADS0..ADS20 are the same ratings with missing
#     values after withdrawal filled with the exit rating; ADS (average discomfort
#     score, the paper's primary DV) is their mean (checked on the data).
#   - SSQ item order (SSQ Pre_k, SSQ Post_k, k = 1..16) is Kennedy et al. (1993):
#     general discomfort, fatigue, headache, eye strain, difficulty focusing,
#     salivation increasing, sweating, nausea, difficulty concentrating, fullness
#     of head, blurred vision, dizzy (eyes open), dizzy (eyes closed), vertigo,
#     stomach awareness, burping; 0-3 each. The 16 named columns GeneralDiscomfort
#     .. Burping are post-minus-pre item change scores (match SSQ Post_k - SSQ Pre_k
#     in 93-100 % of rows; the rest equal the post rating). Sub_Nausea,
#     Sub_Oculomotor, Sub_Disorientation and SSQ_Total are the weighted SSQ scores
#     of those change items (exact match); the "... Post" columns are the weighted
#     scores of the post-exposure items (exact match) and are the ones the paper
#     reports. SSQ_PostLog = log10(SSQ_Total Post + 26) (exact match), the
#     transformed DV of the paper's ANCOVA; it is left out (not on SSQ units).
#   - MSSQ (long form: child and adult sections a, b, c with 9 items each, plus
#     totals), VIMSSQ (named VIMSQ
#     in the file), IPD and gaming experience were measured once before exposure
#     and used as covariates or descriptors, so they are meta_*.
#   - VRNQ items (User1_*, Mechanics1_*, Assistance*_*; 1-7) have no schema id and
#     are locked as meta_vrnq_* below; item order from the OSF VRNQ table: Immersion,
#     Enjoyment, Graphics, Sound, Technology | Navigation, Physical, Pick up items,
#     Use items, 2-handed | Tutorial-Easy, Tutorial-Helpful, Tutorial-Duration,
#     Tutorial-Instructions, In-game prompts, Tutorial-Duration (second).
#   - Column1 (a single value, 6.0, in the first row) is unresolved; locked as meta.
#   - Exposure time (the paper's third cybersickness measure) has no schema DV;
#     Seconds played and its two derived forms are locked as meta below.

# --- Dependent measures: FMS-type sickness rating (0-10) ----------------------
# One value per participant: ADS (below) is the session average the paper
# reports. The single ratings are time points of it, so they are kept apart;
# mapped to fms_score as well, the batch could not average them (Early FMS
# exists only for withdrawers) and the minute-0 baseline became the score.
FMS0: meta_fms_timepoint            # rating at entry into VR (minute 0)
FMS4: meta_fms_timepoint            # minute 4
FMS8: meta_fms_timepoint            # minute 8 (missing after withdrawal)
FMS12: meta_fms_timepoint           # minute 12
FMS16: meta_fms_timepoint           # minute 16
FMS20: meta_fms_timepoint           # minute 20
Early FMS: meta_fms_timepoint       # rating on early withdrawal (only for withdrawers)
Final FMS: meta_fms_timepoint       # rating on exiting VR (all participants)
ADS0: meta_imputed_carried_forward  # FMS rating with the exit rating carried forward after withdrawal (derived)
ADS4: meta_imputed_carried_forward  # FMS rating with the exit rating carried forward after withdrawal (derived)
ADS8: meta_imputed_carried_forward  # FMS rating with the exit rating carried forward after withdrawal (derived)
ADS12: meta_imputed_carried_forward # FMS rating with the exit rating carried forward after withdrawal (derived)
ADS16: meta_imputed_carried_forward # FMS rating with the exit rating carried forward after withdrawal (derived)
ADS20: meta_imputed_carried_forward # FMS rating with the exit rating carried forward after withdrawal (derived)
ADS: fms_score                      # average discomfort score = mean of ADS0..ADS20 (0-10)

# --- Dependent measures: SSQ, post-exposure (weighted scores) -----------------
Sub_Nausea Post: ssq_nausea
Sub_Oculomotr Post: ssq_oculomotor
Sub_Disorientation Post: ssq_disorientation
SSQ_Total Post: ssq_total

# --- Dependent measures: SSQ, post-minus-pre change (weighted scores) ---------
Sub_Nausea: meta_ssq_change_score   # post minus pre; kept apart from the absolute post scores
Sub_Oculomotor: meta_ssq_change_score  # post minus pre; kept apart from the absolute post scores
Sub_Disorientation: meta_ssq_change_score  # post minus pre; kept apart from the absolute post scores
SSQ_Total: meta_ssq_change_score    # post minus pre; kept apart from the absolute post scores

# --- Participants and conditions ---------------------------------------------
ID: meta_participant_id
Mitigation: meta_condition_mitigation   # Blinders (FOV restriction), Snap, Snap & Blinders; empty = none

