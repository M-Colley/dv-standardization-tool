  - id: eye_projected_y_left
    aliases: [projectedY_left, projected_y_left]

  - id: eye_projected_x_right
    aliases: [projectedX_right, projected_x_right]

  - id: eye_projected_y_right
    aliases: [projectedY_right, projected_y_right]

  - id: eye_scaled_gaze_forward
    aliases: [scaledGazeForward, scaled_gaze_forward]

  - id: eye_scaled_left_forward
    aliases: [scaledLeftForward, scaled_left_forward]

  - id: eye_scaled_right_forward
    aliases: [scaledRightForward, scaled_right_forward]

  - id: sensor_arduino_data_1
    aliases: [ArduinoData1, arduino_data_1]

  - id: sensor_arduino_data_2
    aliases: [ArduinoData2, arduino_data_2]

  - id: sensor_arduino_data_3
    aliases: [ArduinoData3, arduino_data_3]

  - id: sensor_pixel_x
    aliases: [PixelX, pixelX, pixel_x]

  - id: sensor_pixel_y
    aliases: [PixelY, pixelY, pixel_y]

  # ── Driving-simulator telemetry (ROADS log_*.csv / OverviewLog / TimestampLog) ──
  # Continuous vehicle/task-state channels logged per tick. Non-DV streams; the
  # admin/condition fields (UserID, ScenarioID, requestID, controlMode) are
  # handled by the never-map blocklist, not here.
  - id: sim_vehicle_speed
    aliases: [vehicleSpeed, vehicle_speed]
  - id: sim_vehicle_position
    aliases: [vehiclePosition, vehicle_position]
  - id: sim_lane_deviation
    aliases: [currentLaneDeviation, current_lane_deviation, laneDeviation]
  - id: sim_closest_lane
    aliases: [closestLane, closest_lane]
  - id: sim_distance_to_end
    aliases: [distanceToEnd, distance_to_end]
  - id: sim_distance_to_end_instructed
    aliases: [distanceToEndOfInstructedPath, distance_to_end_of_instructed_path]
  - id: sim_distance_travelled
    aliases: [distanceTravelledSinceLastLog, distance_travelled_since_last_log]
  - id: sim_path_length_instructed
    aliases: [lengthOfCurrentInstructedPath, length_of_current_instructed_path]
  - id: sim_path_length_input
    aliases: [lengthOfCurrentInstructedInputPath, length_of_current_instructed_input_path]
  - id: sim_elapsed_time_since_access
