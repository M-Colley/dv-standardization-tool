version: "1.0"
schema_type: sensor
updated: "2026-03-05"

# Sensor-stream canonicalization schema used by batch standardization.
# These are non-DV measurement channels (e.g., eye-tracking, telemetry, device feeds).
dvs:
  - id: eye_gaze_forward
    aliases: [gaze.forward, gaze_forward]

  - id: eye_gaze_origin
    aliases: [gaze.origin, gaze_origin]

  - id: eye_inter_pupillary_distance_mm
    aliases: [interPupillaryDistanceInMM, inter_pupillary_distance_mm]

  - id: eye_left_status
    aliases: [leftStatus, left_status]

  - id: eye_left_forward
    aliases: [left.forward, left_forward]

  - id: eye_left_origin
    aliases: [left.origin, left_origin]

  - id: eye_left_pupil_iris_diameter_ratio
    aliases: [leftPupilIrisDiameterRatio, left_pupil_iris_diameter_ratio]

  - id: eye_left_pupil_diameter_mm
    aliases: [leftPupilDiameterInMM, left_pupil_diameter_mm]

  - id: eye_left_iris_diameter_mm
    aliases: [leftIrisDiameterInMM, left_iris_diameter_mm]

  - id: eye_right_status
    aliases: [rightStatus, right_status]

  - id: eye_right_forward
    aliases: [right.forward, right_forward]

  - id: eye_right_origin
    aliases: [right.origin, right_origin]

  - id: eye_right_pupil_iris_diameter_ratio
    aliases: [rightPupilIrisDiameterRatio, right_pupil_iris_diameter_ratio]

  - id: eye_right_pupil_diameter_mm
    aliases: [rightPupilDiameterInMM, right_pupil_diameter_mm]

  - id: eye_right_iris_diameter_mm
    aliases: [rightIrisDiameterInMM, right_iris_diameter_mm]

  - id: eye_diameter_mm
    aliases: [DiameterInMM, diameterInMM, diameter_mm]

  - id: eye_focus_distance
    aliases: [focusDistance, focus_distance]

  - id: eye_focus_stability
    aliases: [focusStability, focus_stability]

  - id: eye_projected_x
    aliases: [projectedX, projected_x]

  - id: eye_projected_y
    aliases: [projectedY, projected_y]

  - id: eye_quad_local_x
    aliases: [quadLocalX, quad_local_x]

  - id: eye_quad_local_y
    aliases: [quadLocalY, quad_local_y]

  - id: eye_quad_norm_x
    aliases: [quadNormX, quad_norm_x]

  - id: eye_quad_norm_y
