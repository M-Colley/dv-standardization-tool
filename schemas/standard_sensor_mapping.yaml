  - id: sim_construction_site_entered
    aliases: [constructionSiteEntered, construction_site_entered]
  - id: sim_end_reached
    aliases: [endReached, end_reached]
  - id: sim_addition_input_amount
    aliases: [amountOfAdditionInput, amount_of_addition_input]
  - id: sim_addition_markers_amount
    aliases: [amountOfAdditionMarkers, amount_of_addition_markers]
  - id: sim_snap_middle_input_amount
