  - id: sim_snap_middle_markers_amount
    aliases: [amountOfSnapToMiddleMarkers, amount_of_snap_to_middle_markers]
  - id: sim_readjustment_input_amount
    aliases: [amountOfReadjustmentInput, amount_of_readjustment_input]
  - id: sim_request_active
