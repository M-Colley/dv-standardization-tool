name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt -r requirements-dev.txt

      - name: Validate schemas
        # Standard schemas, every dataset mapping, the instrument registry and
        # the study designs.
        shell: bash
        run: |
          for f in schemas/*_mapping.yaml schemas/instruments.yaml schemas/study_designs.yaml; do
            python -m opendv.validate_schema "$f" || exit 1
          done

      - name: Install the package and import it outside the checkout
        shell: bash
        run: |
          pip install --no-deps .
          cd "$RUNNER_TEMP"
          python -c "import opendv, opendv._paths as p; assert 'site-packages' in opendv.__file__, opendv.__file__; assert (p.SCHEMAS_DIR / 'standard_dv_mapping.yaml').is_file(); print(opendv.__version__, p.SCHEMAS_DIR)"
          opendv --version

      - name: Run unit tests
        run: python -m pytest tests -q
