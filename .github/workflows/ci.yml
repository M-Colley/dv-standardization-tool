name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt -r requirements-dev.txt

      - name: Validate schemas
        # Standard schemas, every dataset mapping, the instrument registry and
        # the study designs.
        shell: bash
        run: |
          for f in schemas/*_mapping.yaml schemas/instruments.yaml schemas/study_designs.yaml; do
            python scripts/validate_schema.py "$f" || exit 1
          done

      - name: Run unit tests
        run: python -m pytest tests -q
