    location: data/raw/development/incar_vr_gain_chi24
    publication_doi: 10.1145/3613904.3642298
    include_globs: ["*.csv"]
    mapping_path: schemas/incar_vr_gain_chi24_mapping.yaml
    override_standard_aliases: true
    use_llm_deduction: true

  - source_id: bvi_auditory_hav_autoui26
    source_type: local_path
    location: data/raw/development/bvi_auditory_hav_autoui26
