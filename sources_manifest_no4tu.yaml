  # 16 of the 28 development datasets are kept. Not added:
  #   dropped before download (no participant-level table the pipeline reads):
  #     ehmi_perspective_2021, bioinspired_intent_2021
  #   download failed: cooperativity_scale_2026, llm_chatbot_care_2026, acoustic_touch_blv_2023
  #     (Dryad HTTP 401), l2_transfer_control_2022 (Harvard Dataverse guestbook)
  #   after download:
  #     lateral_position_2021: the downloaded survey holds demographics only; the crossing
  #       responses are in data_1.xlsx / data_2.xlsx (over 50 MB, not pinned) and .mat files
  #     driver_eye_contact_2022: the downloaded survey holds demographics and attitudes only; the
  #       perceived-safety keypresses are in AllHerokuData.mat and heroku*.txt (80-870 MB)
  #     ped_woz_field_2018: the workbooks hold clock times of events and coded free text; the
  #       critical gaps are computed from .mat speed logs and the questionnaire is in ini.m
  #     passenger_certainty_2026, passenger_uncertainty_2026: every DV (certainty and uncertainty
  #       sliders, 0-100) is outside the schema; both files come from one crowdsourced study
  #       (shared worker codes)
  #     car_sickness_physio_2023: the questionnaire workbooks are presentation layouts (SSQ
  #       transposed with participants as columns, FMS as stacked blocks with shifting columns)
  #       that sheet, header, pivot and drop_columns cannot turn into a participant table; the
  #       physiological recordings are 0.7-2.1 GB archives
