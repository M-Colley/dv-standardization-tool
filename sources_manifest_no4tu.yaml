    override_standard_aliases: true
    use_llm_deduction: true

  - source_id: ehmi_state_intent_mtap24
    source_type: local_path
    location: data/raw/development/ehmi_state_intent_mtap24
    publication_doi: 10.1007/s11042-024-20497-0
    include_globs: ["data.csv"]
    mapping_path: schemas/ehmi_state_intent_mtap24_mapping.yaml
    override_standard_aliases: true
    use_llm_deduction: true

  - source_id: av_acceptance_vr_ijhci24
    source_type: local_path
    location: data/raw/development/av_acceptance_vr_ijhci24
    publication_doi: 10.1080/10447318.2024.2358577
    include_globs: ["Questionnaire_data/raw_data/*.csv"]
    mapping_path: schemas/av_acceptance_vr_ijhci24_mapping.yaml
    override_standard_aliases: true
    use_llm_deduction: true

  - source_id: fido2_auth_chi23
    source_type: local_path
    location: data/raw/development/fido2_auth_chi23
    publication_doi: 10.1145/3544548.3580993
    include_globs: ["**/data.csv"]
    mapping_path: schemas/fido2_auth_chi23_mapping.yaml
    override_standard_aliases: true
    use_llm_deduction: true

  - source_id: pairsonic_cscw24
    source_type: local_path
    location: data/raw/development/pairsonic_cscw24
    publication_doi: 10.1145/3686964
    include_globs: ["**/data.csv"]
    mapping_path: schemas/pairsonic_cscw24_mapping.yaml
    override_standard_aliases: true
    use_llm_deduction: true

  - source_id: curved_dragging_vr_ijhci26
    source_type: local_path
    location: data/raw/development/curved_dragging_vr_ijhci26
    publication_doi: 10.1080/10447318.2026.2738094
    include_globs: ["*.xlsx"]
    table_options:
      subjective_workload_processed_condition_data.xlsx:
        sheet: NASA_TLX_Data   # the other sheets hold a README and test statistics
        header: 1              # row 0 is a title
        pivot:                 # one score row per subscale -> one column per subscale
          index: [experiment, measurement_condition, subject_id, curvature, curvature_code, depth_m]
          columns: subscale
          values: score
    mapping_path: schemas/curved_dragging_vr_ijhci26_mapping.yaml
    override_standard_aliases: true
    use_llm_deduction: true

  - source_id: fov_snapturn_tvcg24
    source_type: local_path
    location: data/raw/development/fov_snapturn_tvcg24
    publication_doi: 10.1109/TVCG.2024.3470214
    include_globs: ["Data/*.csv"]
    mapping_path: schemas/fov_snapturn_tvcg24_mapping.yaml
    override_standard_aliases: true
    use_llm_deduction: true

  - source_id: handsize_touch_mobilehci19
    source_type: local_path
