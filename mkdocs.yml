# Documentation site: pip install --group docs, then `mkdocs serve` (preview)
# or `mkdocs build --strict` (what CI runs). Pages are the Markdown files in docs/.
site_name: OpenDV-HCI
site_description: Schema-driven standardization and meta-analysis of dependent variables in HCI research
repo_url: https://github.com/M-Colley/dv-standardization-tool
repo_name: M-Colley/dv-standardization-tool
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 2
            members_order: source

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences

# Many pages link to code and schema files outside docs/ (e.g. ../schemas/...),
# which are not site pages; report those as info instead of failing --strict.
validation:
  links:
    not_found: warn
    unrecognized_links: info

nav:
  - Home: index.md
  - Getting started:
      - Overview: overview.md
      - Usage workflows: usage_workflows.md
      - Reproducing the results: reproducibility.md
      - Troubleshooting: troubleshooting_index.md
  - Guides:
      - Multi-study analysis: multi_study_analysis_guide.md
      - Dataset guidelines: dataset_guidelines.md
      - Schema design: schema_design.md
  - Reference:
      - Python API: api.md
      - Architecture: architecture.md
      - Directory map: directory_map.md
  - Research:
      - Research agenda: research_agenda.md
      - Confirmatory shortlist test: confirmatory_shortlist_results.md
      - Pre-registration: preregistration_confirmatory_shortlist.md
      - Summary: summary.md
      - Future plans: future_plans.md
  - Changelog: changelog.md
  - Release notes 2.1: new_features_v2.1.md
