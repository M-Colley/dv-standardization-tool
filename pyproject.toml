[build-system]
requires = ["setuptools>=84.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opendv-hci"
version = "3.1.0"
description = "Schema-driven standardization and meta-analysis of dependent variables in HCI research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Mark Colley"},
]
keywords = ["HCI", "dependent-variables", "standardization", "meta-analysis", "open-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=3.0.6",
    "numpy>=2.5.4",
    "scipy>=1.16.3",  # capped below 1.17 by lingam's dependency pygam 0.12
    "pyyaml>=6.0.3",
    "tqdm>=4.70.1",
    "openpyxl>=3.1.5",
    "rapidfuzz>=3.14.6",
    "pydantic>=2.14.1",
    "httpx>=0.28.1",
    "tenacity>=9.2.1",
    "beautifulsoup4>=4.15.0",
    "charset-normalizer>=3.5.2",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "scikit-learn>=1.9.1",
    "lingam>=1.12.2",  # 1.13.0 pins scipy<=1.13.1 (incompatible with numpy>=2.3)
    "frictionless>=5.21.0",
    "rocrate>=0.16.0",
    "pyarrow>=26.0.0",
    "ruamel.yaml>=0.19.1",
]

[project.optional-dependencies]
# Aligned with requirements-llm.txt. torch, transformers and pypdf are
# required by scripts/llm_utils.py (local-LLM alias deduction + PDF context
# extraction); scikit-learn is already in core deps so it is omitted here.
# For CUDA, install the matching torch wheel first (see requirements-llm.txt).
llm = [
    "torch>=2.14.1",
    "openai>=3.33.0",
    "sentence-transformers>=6.1.0",
    "transformers>=5.20.1",
    "accelerate>=1.15.0",
    "pypdf>=6.21.1",
]
# Aligned with requirements-ui.txt. matplotlib / seaborn / scikit-learn live
# in core deps already so they are omitted from this extra.
ui = [
    "streamlit>=1.66.0",
    "plotly>=7.1.0",
    "watchdog>=6.0.0",
]
dev = ["pytest>=9.1.1", "ruff>=0.17.1"]
all = ["opendv-hci[llm,ui,dev]"]

[project.urls]
Changelog = "https://github.com/M-Colley/dv-standardization-tool/blob/main/docs/changelog.md"
Repository = "https://github.com/M-Colley/dv-standardization-tool"
Documentation = "https://github.com/M-Colley/dv-standardization-tool/tree/main/docs"

[project.scripts]
opendv = "opendv.cli:main"
opendv-standardize = "opendv.convert_dv:main"
opendv-batch = "opendv.run_batch_standardization:main"
opendv-analyze = "opendv.analysis.multi_study_analysis:main"
opendv-review = "opendv.mapping_review:main"

[tool.setuptools]
# Only the opendv package is installed; scripts/ and analyses/ hold
# compatibility aliases for source checkouts. The repository's schemas/
# folder ships inside the package as opendv.schemas (opendv/_paths.py).
packages = [
    "opendv",
    "opendv.analysis",
    "opendv.schemas",
    "opendv.sources",
    "opendv.ui",
    "opendv.ui.components",
]

[tool.setuptools.package-dir]
"opendv.schemas" = "schemas"

[tool.setuptools.package-data]
"opendv.schemas" = ["*.yaml"]
"opendv.analysis" = ["*.R"]
"opendv.ui" = ["assets/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
