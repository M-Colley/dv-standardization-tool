[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opendv-hci"
version = "3.0.0"
description = "Schema-driven standardization and meta-analysis of dependent variables in HCI research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Mark Colley"},
]
keywords = ["HCI", "dependent-variables", "standardization", "meta-analysis", "open-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "openpyxl>=3.1",
    "rapidfuzz>=2.13",
    "pydantic>=2.0",
    "httpx>=0.28",
    "tenacity>=9.1",
    "beautifulsoup4>=4.13",
    "charset-normalizer>=3.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "lingam>=1.8",
]

[project.optional-dependencies]
# Aligned with requirements-llm.txt. transformers and pypdf are required by
# scripts/llm_utils.py (local-LLM alias deduction + PDF context extraction);
# scikit-learn is already in core deps so it is omitted here.
llm = [
    "openai>=2.21",
    "sentence-transformers>=5.2",
    "transformers>=5.5",
    "pypdf>=6.7",
]
# Aligned with requirements-ui.txt. matplotlib / seaborn / scikit-learn live
# in core deps already so they are omitted from this extra.
ui = [
    "streamlit>=1.55",
    "plotly>=6.6",
    "watchdog>=2.1",
]
dev = ["pytest>=8.0", "ruff>=0.4"]
all = ["opendv-hci[llm,ui,dev]"]

[project.urls]
Repository = "https://github.com/M-Colley/dv-standardization-tool"
Documentation = "https://github.com/M-Colley/dv-standardization-tool/tree/main/docs"

[project.scripts]
opendv-standardize = "scripts.convert_dv:main"
opendv-batch = "scripts.run_batch_standardization:main"
opendv-analyze = "analyses.multi_study_analysis:main"
opendv = "__main__:main"

[tool.setuptools.packages.find]
include = ["scripts*", "analyses*", "schemas*", "ui*"]

[tool.setuptools.package-data]
schemas = ["*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
